name: RRW | Gerar Reels originais no GitHub
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gerar-reels-rrw.yml"
      - "scripts/render_rrw.py"
permissions:
  contents: write
concurrency:
  group: rrw-render-v2
  cancel-in-progress: false
jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Python sem apt-get
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Pillow e FFmpeg portável
        run: |
          python -m pip install --disable-pip-version-check pillow==11.1.0 imageio-ffmpeg==0.6.0
          mkdir -p /tmp/rrw-bin
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /tmp/rrw-bin/ffmpeg
          echo "/tmp/rrw-bin" >> "$GITHUB_PATH"
          /tmp/rrw-bin/ffmpeg -version | head -n 1
      - name: Registrar o logotipo oficial como ativo permanente no repositorio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          if [ ! -s assets/rrw-logo.png ]; then
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/rrwvistoriasimobiliarias-oss/rrw-midia-instagram/c907f11c965cb98f51f98d674fa852dd742a7960/instagram/reels/04-apoio-operacional.jpg" -o /tmp/rrw-brand-cover.jpg
            python3 - <<'PY'
          from PIL import Image
          im=Image.open("/tmp/rrw-brand-cover.jpg").convert("RGB")
          w,h=im.size
          logo=im.crop((int(w*.095),int(h*.096),int(w*.235),int(h*.177)))
          logo.save("assets/rrw-logo.png",optimize=True)
          PY
          fi
      - name: Gerar cinco Reels a partir dos fontes próprios
        run: python3 scripts/render_rrw.py
      - name: Validar formatos, dimensões e durações
        shell: bash
        run: |
          set -euo pipefail
          for f in instagram/reels/*.mp4; do
            echo "$f"
            ffmpeg -hide_banner -i "$f" -f null - 2>&1 | tee /tmp/rrw-video-check.txt
            grep -q 'Video: h264' /tmp/rrw-video-check.txt
            grep -q '1080x1920' /tmp/rrw-video-check.txt
          done
          test "$(find instagram/reels -maxdepth 1 -name '*.mp4' | wc -l)" -eq 5
      - name: Versionar vídeos e capas, com deploy automático no Cloudflare Pages
        run: |
          git config user.name "RRW media automation"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram/reels/*.mp4 instagram/reels/*.jpg assets/rrw-logo.png
          if ! git diff --cached --quiet; then
            git commit -m "RRW: renderizar 5 Reels originais [skip ci]"
            git push
          fi
