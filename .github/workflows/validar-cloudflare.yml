name: RRW | Validar hospedagem Cloudflare
# Validacao final apos revisao de cache e barra de progresso
# Revalidacao do Reel 02 com trilha sonora em 07/11/2026
# Rodada de verificacao apos novo deploy de index.html
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validar-cloudflare.yml"
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Conferir URLs publicas e integridade MP4 e JPG
        shell: bash
        run: |
          set -euo pipefail
          base="https://rrw-midia-instagram.pages.dev/instagram/reels"
          mkdir -p /tmp/rrw-cloudflare
          for stem in 01-vistoria-entrada 02-vistoria-saida 03-registro-fotografico 04-apoio-operacional 05-vistoria-profissional; do
            for ext in mp4 jpg; do
              file="$stem.$ext"
              expected="instagram/reels/$file"
              result="/tmp/rrw-cloudflare/$file"
              echo "Verificando $file..."
              matched=false
              for attempt in $(seq 1 15); do
                curl -fsSL --retry 2 --retry-all-errors --retry-delay 3 --connect-timeout 12 --max-time 90 "$base/$file?rev=$(git rev-parse HEAD)&attempt=$attempt" -o "$result"
                if test -s "$result" && cmp -s "$expected" "$result"; then
                  matched=true
                  break
                fi
                echo "Cloudflare ainda nao propagou $file (tentativa $attempt)"
                sleep 8
              done
              echo "Local: $(sha256sum "$expected")"
              echo "Publico: $(sha256sum "$result")"
              if [ "$matched" != true ]; then
                echo "::error::O arquivo publico NAO corresponde ao arquivo do GitHub: $file"
                exit 1
              fi
              echo "OK $file $(wc -c < "$result") bytes"
            done
          done
          echo "TODOS OS ARQUIVOS PUBLICOS CONFERIDOS: 5 MP4 e 5 JPG"
