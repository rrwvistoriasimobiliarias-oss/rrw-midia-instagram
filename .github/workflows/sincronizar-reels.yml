name: RRW - Sincronizar acervo MP4 e JPG
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sincronizar-reels.yml"
permissions:
  contents: write
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Baixar midias publicas do acervo RRW original
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p instagram/reels
          base="https://rrw-midia-instagram.lovable.app/instagram/reels"
          for stem in 01-vistoria-entrada 02-vistoria-saida 03-registro-fotografico 04-apoio-operacional 05-vistoria-profissional; do
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 "$base/$stem.mp4" -o "instagram/reels/$stem.mp4"
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 "$base/$stem.jpg" -o "instagram/reels/$stem.jpg"
            test "$(wc -c < "instagram/reels/$stem.mp4")" -gt 50000
            test "$(wc -c < "instagram/reels/$stem.jpg")" -gt 5000
          done
      - name: Validar formatos
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          for f in instagram/reels/*.mp4; do
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 "$f"
            ffmpeg -v error -i "$f" -t 1 -f null -
          done
      - name: Salvar acervo de origem no GitHub (sem publicar no Instagram)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RRW media automation"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram/reels/*.mp4 instagram/reels/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m "media: sincronizar acervo MP4/JPG de origem para hospedagem Cloudflare"
            git push
          fi
