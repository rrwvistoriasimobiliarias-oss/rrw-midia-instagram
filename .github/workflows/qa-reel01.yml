name: RRW | QA visual Reel 01
# Revisao apos ajuste de barra de progresso
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/qa-reel01.yml"
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar ferramentas
        run: python -m pip install --disable-pip-version-check pillow==11.1.0 imageio-ffmpeg==0.6.0
      - name: Gerar quadro a quadro de revisao
        run: |
          python - <<'PY'
          import subprocess, imageio_ffmpeg
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont
          ffmpeg=imageio_ffmpeg.get_ffmpeg_exe()
          path="instagram/reels/01-vistoria-entrada.mp4"
          out=Path("qa"); out.mkdir(exist_ok=True)
          pics=[]
          for i,t in enumerate([0.8,3.3,6.2]):
              f=Path("/tmp/frame_"+str(i)+".jpg")
              subprocess.run([ffmpeg,"-hide_banner","-loglevel","error","-ss",str(t),"-i",path,"-frames:v","1","-y",str(f)],check=True)
              im=Image.open(f).convert("RGB").resize((360,640))
              pics.append(im)
          sheet=Image.new("RGB",(1080,705),(9,25,45))
          d=ImageDraw.Draw(sheet)
          for i,pic in enumerate(pics):
              sheet.paste(pic,(i*360,30))
              d.text((i*360+14,677),["0,8 s — GANCHO","3,3 s — MENSAGEM","6,2 s — CTA"][i],fill="white")
          sheet.save(out/"reel01-revisao.jpg",quality=89)
          PY
      - name: Salvar revisao
        run: |
          git config user.name "RRW media automation"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add qa/reel01-revisao.jpg
          if ! git diff --cached --quiet; then
            git commit -m "RRW QA: quadro a quadro do Reel 01 [skip ci]"
            git pull --rebase origin main
            git push
          fi
